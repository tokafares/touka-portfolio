    <!-- Apply the saved language, direction and theme before first paint (keys match LanguageProvider / ThemeProvider).
         Fonts are self-hosted and bundled; Cairo is loaded on demand by LanguageProvider. -->
    <script>
      (function () {
        var root = document.documentElement
        try {
          var lang = localStorage.getItem('touka:lang')
          if (lang === 'ar') {
            root.lang = 'ar'
            root.dir = 'rtl'
          }
          if (localStorage.getItem('touka:theme') === 'light') {
            root.setAttribute('data-theme', 'light')
            root.style.colorScheme = 'light'
          }
        } catch (e) {}
      })()
    </script>
